# Blade proofs.
#
# Builds the Rocq proof tower and its two lanes outside the tower, re-checks
# the compiled objects with the independent checker, runs `Print Assumptions`
# on every counted tower result (all must be closed), and verifies the
# theorem counts quoted in proofs/README.md and docs/proofs.md and that every
# .v file is in its manifest.
#
# Separate from ci.yml because it needs Rocq and nothing else -- no .NET, no
# native toolchain -- and runs only when the proofs or their counted
# documentation change.
#
# The three manifests:
#   proofs/_CoqProject         the axiom-free tower (counted)
#   proofs/reals/_CoqProject   Rocq's Reals axioms, outside the tower (uncounted)
#   proofs/floats/_CoqProject  primitive floats, outside the tower (uncounted)
#
# The sources follow the Rocq 9 standard (`From Stdlib Require`, the 8.20 /
# 9.0 lemma names), so the build runs in the official Rocq 9.0.1 image, the
# version the Rocq Platform supplies locally. Ubuntu's `coq` package is 8.18
# and cannot build them.
#
# Two jobs, because the image has no PowerShell: `manifests` (Ubuntu, pwsh)
# checks the counts and generates the Print Assumptions probe; `build` (the
# Rocq image) compiles everything and checks the probe's answers.

name: Proofs

on:
  push:
    paths:
      - 'proofs/**'
      - 'docs/proofs.md'
      - '.github/workflows/proofs.yml'
  pull_request:
    paths:
      - 'proofs/**'
      - 'docs/proofs.md'
      - '.github/workflows/proofs.yml'
  workflow_dispatch:

jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Theorem counts and manifest coverage
        shell: pwsh
        run: ./proofs/count-theorems.ps1 -Check

      - name: Generate the Print Assumptions probe
        shell: pwsh
        run: ./proofs/check-assumptions.ps1 -EmitProbe "$env:RUNNER_TEMP/BladeAssumptionsProbe.v"

      - uses: actions/upload-artifact@v4
        with:
          name: assumptions-probe
          path: ${{ runner.temp }}/BladeAssumptionsProbe.v
          retention-days: 7

  build:
    needs: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: rocq/rocq-prover:9.0.1
      # The image's default user cannot write the runner's mounted workspace.
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # The image puts Rocq in an opam switch under its user's home and only
      # its login shell adds that to PATH; a container step's shell does not.
      #
      # The image ships ONLY the Rocq 9 tool names -- `rocq` (with the `c`,
      # `makefile` and `dep` subcommands) and `rocqchk` -- and none of the Coq
      # ones (`coqc`, `coq_makefile`, `coqchk`), which come from the separate
      # `coq-core` compatibility package. So every step below uses the Rocq
      # names; looking for `coqc` found the switch and then failed with 127.
      - name: Locate Rocq
        run: |
          if ! command -v rocq >/dev/null 2>&1; then
            bin=""
            for d in /home/*/.opam/*/bin /root/.opam/*/bin; do
              if [ -e "$d/rocq" ]; then bin="$d"; break; fi
            done
            if [ -z "$bin" ]; then
              hit=$(find / -path /proc -prune -o -name rocq \( -type f -o -type l \) -print 2>/dev/null | head -n 1)
              [ -n "$hit" ] && bin=$(dirname "$hit")
            fi
            if [ -z "$bin" ]; then
              echo "no rocq anywhere in the image"; ls -la /home/* 2>/dev/null; exit 1
            fi
            echo "Rocq bin: $bin"; ls "$bin" | grep -E '^(coq|rocq)' || true
            echo "$bin" >> "$GITHUB_PATH"
          fi

      - name: Rocq version
        run: |
          rocq c --version
          command -v rocqchk

      - name: Build the tower
        working-directory: proofs
        run: |
          rocq makefile -f _CoqProject -o Makefile.coq
          make -f Makefile.coq -j2

      - name: Independent check of the tower (rocqchk)
        working-directory: proofs
        run: |
          mods=$(grep -E '\.v$' _CoqProject | sed -E 's/\.v$//; s/^/Blade./')
          rocqchk -silent -o -Q . Blade $mods

      - uses: actions/download-artifact@v4
        with:
          name: assumptions-probe
          path: ${{ runner.temp }}/probe

      - name: Every tower result is axiom-free (Print Assumptions)
        working-directory: proofs
        run: |
          probe="$RUNNER_TEMP/probe/BladeAssumptionsProbe.v"
          total=$(grep -c '^Print Assumptions' "$probe")
          out=$(rocq c -Q . Blade "$probe" 2>&1) || { echo "$out" | tail -n 30; exit 1; }
          closed=$(printf '%s\n' "$out" | grep -c '^Closed under the global context' || true)
          axioms=$(printf '%s\n' "$out" | grep -c '^Axioms:' || true)
          echo "queries: $total  closed: $closed  with axioms: $axioms"
          if [ "$axioms" -ne 0 ] || [ "$closed" -ne "$total" ]; then
            printf '%s\n' "$out" | grep -B1 -A6 '^Axioms:' | head -n 60
            exit 1
          fi

      - name: Build the reals lane
        working-directory: proofs/reals
        run: |
          for f in $(grep -E '\.v$' _CoqProject); do
            echo "rocq c $f"
            rocq c -Q .. Blade -Q . BladeReals "$f"
          done

      - name: Build the floats lane
        working-directory: proofs/floats
        run: |
          for f in $(grep -E '\.v$' _CoqProject); do
            echo "rocq c $f"
            rocq c -Q . BladeFloats "$f"
          done
